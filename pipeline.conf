# pipeline v3 stage -> agent/model mapping (bash syntax; every var overridable via env; PROFILE=<name> sources pipeline.conf.<name> first)
# Implementer family = Gemini (agy); verifying roles use other families (Grok/OpenAI/Anthropic). Quota: Grok carries the cheap/high-volume roles.
SPEC_AGENT=amp;        SPEC_MODE=${SPEC_MODE:-high}; SPEC_FALLBACK=${SPEC_FALLBACK:-medium}        # S1 spec (1 Amp call)
TESTS_AGENT=${TESTS_AGENT:-grok};  TESTS_MODEL=${TESTS_MODEL:-$(case $TESTS_AGENT in grok) echo grok-4.7;; agy) echo gemini-3.8-flash-high;; amp) echo -;; *) echo ${CORE_TESTS_MODEL:-gpt-6.1-sol};; esac)};  TESTS_EFFORT=${TESTS_EFFORT:-medium}    # S2 tests-first (alt: TESTS_AGENT=agy)
IMPL_MODEL=${IMPL_MODEL:-gemini-3.8-flash-high}                                                  # S3 implementer (agy herdr agent)
IMPL2_AGENT=${IMPL2_AGENT:-grok}; IMPL2_MODEL=${IMPL2_MODEL:-grok-4.7}; IMPL2_EFFORT=${IMPL2_EFFORT:-xhigh}  # S3 escalation implementer (gemini-4-argon not in agy models on 2026-10-14)
IMPL_ESCALATE_AFTER=${IMPL_ESCALATE_AFTER:-2}   # consecutive S4 failures before switching implementer; any review/judge REJECT also switches
LINT_CMD=${LINT_CMD:-"ruff check --isolated --select E9,F,B --output-format concise ."}          # S4 deterministic gate (must be green before S5/S6)
TEST_CMD=${TEST_CMD:-"python3 -m unittest discover -v"}
PREREVIEW=${PREREVIEW:-0}; PREREVIEW_MODEL=${PREREVIEW_MODEL:-grok-4.7}; PREREVIEW_EFFORT=${PREREVIEW_EFFORT:-medium}   # S4.5 optional Grok self-review prefilter
REVIEW_AGENT=${REVIEW_AGENT:-droid}; REVIEW_MODEL=${REVIEW_MODEL:-gpt-6.1-sol}; REVIEW_EFFORT=${REVIEW_EFFORT:-high}     # S5 (REVIEW_AGENT=amp -> amp -m $AMP_REVIEW_MODE)
SECURITY_MODEL=${SECURITY_MODEL:-claude-sonnet-5-5}; SECURITY_EFFORT=${SECURITY_EFFORT:-high}                            # S6 Droid read-only
DOCS_AGENT=${DOCS_AGENT:-grok}; DOCS_MODEL=${DOCS_MODEL:-$(case $DOCS_AGENT in grok) echo grok-4.7;; agy) echo gemini-3.8-flash-low;; amp) echo -;; *) echo ${CORE_DOCS_MODEL:-claude-haiku-5-5};; esac)}; DOCS_EFFORT=${DOCS_EFFORT:-medium}                    # S7 (alt: DOCS_AGENT=agy DOCS_MODEL=gemini-3.8-flash-low)
JUDGE_AGENT=${JUDGE_AGENT:-droid}; JUDGE_MODEL=${JUDGE_MODEL:-claude-opus-5-5}; JUDGE_EFFORT=${JUDGE_EFFORT:-high}       # S8 (JUDGE_AGENT=amp -> amp -m $AMP_JUDGE_MODE)
RETRO_AGENT=${RETRO_AGENT:-grok}; RETRO_MODEL=${RETRO_MODEL:-$(case $RETRO_AGENT in grok) echo grok-4.7;; agy) echo gemini-3.8-flash-low;; amp) echo -;; *) echo ${CORE_RETRO_MODEL:-claude-haiku-5-5};; esac)}; RETRO_EFFORT=${RETRO_EFFORT:-high}                # S9 (also: droid, amp)
AMP_REVIEW_MODE=${AMP_REVIEW_MODE:-medium}; AMP_JUDGE_MODE=${AMP_JUDGE_MODE:-high}
MAX_IMPL_LOOPS=${MAX_IMPL_LOOPS:-2}; MAX_REVIEW_LOOPS=${MAX_REVIEW_LOOPS:-2}; MAX_JUDGE_LOOPS=${MAX_JUDGE_LOOPS:-1}
DROID_AUTO_RO=${DROID_AUTO_RO:-medium}; DROID_AUTO_RW=${DROID_AUTO_RW:-medium}
STEP_TIMEOUT=${STEP_TIMEOUT:-1200}
PRIVATE_DIR=${PRIVATE_DIR:-$HOME/.agents-lab-private}
GROK_STEP_TIMEOUT=${GROK_STEP_TIMEOUT:-1800}      # grok stages think long (t10: S2 >30 min at high)
DROID_PAID_AVAILABLE=${DROID_PAID_AVAILABLE:-1}  # 0 while the Droid paid quota is empty (PROFILE=core sets it)
# TESTS_EFFORT_NO_PLAN removed in v3.2 (S2 effort locked to TESTS_EFFORT; missing Test plan fails the S1 gate)
# ---- v3.3: model id catalogue (the ONLY place model ids live; lab_tools.py reads these)
export LAB_PAID_MODELS=${LAB_PAID_MODELS:-"claude-sonnet-5-5 gpt-6.1-sol"} LAB_CORE_MODELS=${LAB_CORE_MODELS:-"kimi-k3 glm-5.3"}
export LAB_GROK_MODEL=${LAB_GROK_MODEL:-grok-4.7} LAB_EXTRA_IMPL2_MODELS=${LAB_EXTRA_IMPL2_MODELS:-deepseek-v4.1-flash}
# ---- budgets: SOFT caps checked at stage boundaries only (in-stage cap = STEP_TIMEOUT/GROK_STEP_TIMEOUT); exceed -> ESCALATE, exit 5.
# Calls != tokens (herdr sessions expose no token data). PROVISIONAL - recalibrate after real runs.
# Observed orchestrator calls (successful runs): t10 amp 2 / grok 7 / droid 3 / agy 2 / total 14, 6245s; t11 amp 1 / grok 6 / droid 4 / agy 2 / total 13, 3900s.
# Caps = ~2x worst observed + worst-case loop allowance (2 review rounds + format re-prompts + 1 judge fix + dispute + escalation).
TASK_TIMEOUT=${TASK_TIMEOUT:-7200}; MAX_CALLS_TOTAL=${MAX_CALLS_TOTAL:-32}
MAX_CALLS_AMP=${MAX_CALLS_AMP:-3}; MAX_CALLS_DROID=${MAX_CALLS_DROID:-12}; MAX_CALLS_GROK=${MAX_CALLS_GROK:-14}; MAX_CALLS_AGY=${MAX_CALLS_AGY:-8}
# ---- v3.3: test strength (S4 mutation sampling on a sandboxed copy), read-only reviewers, grounding
MUTATION_N=${MUTATION_N:-5}; MUTATION_FLOOR=${MUTATION_FLOOR:-0.6}; MUTATION_GATE=${MUTATION_GATE:-warn}   # warn|fail (fail -> ESCALATE)
RO_REVIEW=${RO_REVIEW:-1}; GROUND_REPRO=${GROUND_REPRO:-1}; PROTECTED_TASKS=${PROTECTED_TASKS:-"t1 t2 t6 t7"}; RULE_EXPIRE_MERGES=${RULE_EXPIRE_MERGES:-10}
# S1 amp hard timeout (s); t12: amp websocket connect_failed hung 19 min with no reconnect
S1_TIMEOUT=${S1_TIMEOUT:-900}
# v3.4 stage switches (LIGHT=1 sets all three to 1)
SINGLE_REVIEW=${SINGLE_REVIEW:-0}; SKIP_DOCS=${SKIP_DOCS:-0}; SKIP_RETRO=${SKIP_RETRO:-0}
